apiVersion: v1
kind: Service
metadata:
  name: osrm
  namespace: coldcase
spec:
  ports:
    - port: 5000
  selector:
    app: osrm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osrm
  namespace: coldcase
spec:
  replicas: 1
  selector:
    matchLabels:
      app: osrm
  template:
    metadata:
      labels:
        app: osrm
    spec:
      containers:
        - name: osrm
          image: devdamian/coldcase-osrm:latest
          imagePullPolicy: Always
          args: ["osrm-routed", "--algorithm", "mld", "/data/el-salvador-latest.osrm"]
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "50m"
              memory: "100Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          # Kubernetes readiness and liveness probes to verify OSRM availability
          readinessProbe:
            httpGet:
              path: /route/v1/driving/-89.2182,13.6929;-89.2045,13.7001?overview=false
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /route/v1/driving/-89.2182,13.6929;-89.2045,13.7001?overview=false
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5

